# Override para publicar os serviços atrás do Traefik, usando os FQDNs do .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Pressupõe um Traefik já rodando, conectado à rede externa `traefik`, com um
# entrypoint `websecure` e um certresolver chamado `le` (ajuste se necessário).

services:
  homepage:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.purple-homepage.rule: Host(`${HOMEPAGE_FQDN}`)
      traefik.http.routers.purple-homepage.entrypoints: websecure
      traefik.http.routers.purple-homepage.tls.certresolver: le
      traefik.http.services.purple-homepage.loadbalancer.server.port: '3004'

  site:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.purple-site.rule: Host(`${SITE_FQDN}`)
      traefik.http.routers.purple-site.entrypoints: websecure
      traefik.http.routers.purple-site.tls.certresolver: le
      traefik.http.services.purple-site.loadbalancer.server.port: '3000'

  admin:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.purple-admin.rule: Host(`${ADMIN_FQDN}`)
      traefik.http.routers.purple-admin.entrypoints: websecure
      traefik.http.routers.purple-admin.tls.certresolver: le
      traefik.http.services.purple-admin.loadbalancer.server.port: '3001'

  mcp-public:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.purple-mcp.rule: Host(`${MCP_PUBLIC_FQDN}`)
      traefik.http.routers.purple-mcp.entrypoints: websecure
      traefik.http.routers.purple-mcp.tls.certresolver: le
      traefik.http.services.purple-mcp.loadbalancer.server.port: '3002'

  mcp-admin:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik
      traefik.http.routers.purple-mcp-admin.rule: Host(`${MCP_ADMIN_FQDN}`)
      traefik.http.routers.purple-mcp-admin.entrypoints: websecure
      traefik.http.routers.purple-mcp-admin.tls.certresolver: le
      traefik.http.services.purple-mcp-admin.loadbalancer.server.port: '3003'

  # O banco não ganha rota de Traefik: só perde a porta no host. É *override* de
  # um serviço declarado em `database/docker-compose.yml`, não declaração — é por
  # isso que o nome aparece aqui sem violar a regra do `AGENTS.md` ("não declare
  # postgres, migrate ou seed em nenhum compose"). Não acrescente `image`,
  # `build`, `environment` nem `volumes` a este bloco.
  postgres:
    ports: !reset []

  # Ferramenta de depuração sem autenticação, com rota até o mcp-admin por
  # dentro da rede `internal`: num deploy atrás do proxy ela não publica porta
  # no host, e de propósito não recebe rótulo de Traefik — não há URL pública
  # para ela. O container continua de pé; para abrir a UI no servidor, faça um
  # túnel SSH até o IP do container (`docker inspect purple-skills-mcp-inspector`
  # mostra o IP na rede `internal`).
  mcp-inspector:
    ports: !reset []

networks:
  traefik:
    external: true
