# Purple Skills — orquestração local completa.
#
#   docker compose run --rm migrate     # aplica as migrations (uma vez)
#   docker compose up -d                # sobe site, admin e os dois MCPs
#   docker compose run --rm seed        # (opcional) popula skills de exemplo
#
# Em produção cada imagem também roda isolada, apontando para um Postgres
# externo via DATABASE_URL.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-purple_skills}
  SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:3000}
  SITE_NAME: ${SITE_NAME:-Purple Skills}

x-app-common: &app-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [internal]

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-purple_skills}
      # `trust` só valeria dentro do container; mantemos scram por padrão.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-purple_skills}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Passo dedicado de migrations — nunca roda junto com os 4 serviços.
  migrate:
    image: ghcr.io/patrickbrandao/purple-skills-site:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    environment: *app-env
    command: ['node', 'packages/db/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    # Perfil próprio: `up -d` não sobe este serviço, só `compose run migrate`.
    profiles: [migrate]
    networks: [internal]

  # Skills de exemplo para demonstração (perfil opcional).
  seed:
    image: ghcr.io/patrickbrandao/purple-skills-site:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    environment: *app-env
    command: ['node', 'packages/db/dist/seed.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    profiles: [seed]
    networks: [internal]

  site:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-site:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    ports:
      - '${SITE_PORT:-3000}:3000'

  admin:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-admin:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      <<: *app-env
      PORT: 3001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    ports:
      - '${ADMIN_PORT:-3001}:3001'

  mcp-public:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-mcp-public:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp-public/Dockerfile
    environment:
      <<: *app-env
      PORT: 3002
      MCP_PUBLIC_KEY: ${MCP_PUBLIC_KEY:-}
    ports:
      - '${MCP_PUBLIC_PORT:-3002}:3002'

  mcp-admin:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-mcp-admin:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp-admin/Dockerfile
    environment:
      <<: *app-env
      PORT: 3003
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:?defina MCP_ADMIN_TOKEN no .env}
    ports:
      - '${MCP_ADMIN_PORT:-3003}:3003'

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
