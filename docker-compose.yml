# Purple Skills — orquestração local completa.
#
#   docker compose run --rm migrate     # aplica database/schema/*.sql (uma vez)
#   docker compose up -d                # sobe homepage, site, admin e os dois MCPs
#   docker compose run --rm seed        # (opcional) popula skills de exemplo
#
# Em produção cada imagem também roda isolada, apontando para um Postgres
# externo via DATABASE_URL.
#
# Os serviços `postgres`, `migrate` e `seed` NÃO moram aqui: são do agente DBA
# e vêm de `database/docker-compose.yml` pelo `include` abaixo. Alterações no
# banco (imagem, volume, schema, carga de exemplo) vão naquele arquivo.
#
# As portas são publicadas só no loopback por padrão. O Docker escreve regras
# de iptables diretamente e um bind em 0.0.0.0 contorna o UFW na maioria das
# instalações Debian/Ubuntu — expor o Postgres e o painel assim, sem perceber,
# é fácil demais. Para alcançar os serviços de outra máquina (um servidor de
# testes remoto, por exemplo), defina BIND_ADDR=0.0.0.0 no .env, cientes de que
# aí eles ficam acessíveis para quem chegar na rede.

# `project_directory: .` faz os caminhos relativos do arquivo incluído (e o
# `.env` lido pelo compose) resolverem a partir da raiz, e não de `database/`.
include:
  - path: database/docker-compose.yml
    project_directory: .

# O `.env` do compose serve para interpolar `${VAR}` NESTE arquivo; ele não
# chega sozinho aos containers. Tudo o que a aplicação lê precisa estar listado
# em `environment`, ou o ajuste do operador é ignorado em silêncio.
x-app-env: &app-env
  NODE_ENV: production
  # Campos separados em vez de DATABASE_URL: a senha não passa por parse de URL,
  # então `/`, `?`, `#` e `%` funcionam sem percent-encoding. Os nomes e o
  # significado destas cinco chaves são o contrato do DBA — ver database/README.md.
  PGHOST: postgres
  PGPORT: '5432'
  PGUSER: ${POSTGRES_USER:-postgres}
  PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
  PGDATABASE: ${POSTGRES_DB:-purple_skills}
  SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:3000}
  SITE_NAME: ${SITE_NAME:-Purple Skills}
  # Em quais proxies confiar para X-Forwarded-*. Vazio = loopback + faixas privadas.
  TRUST_PROXY: ${TRUST_PROXY:-}
  # Defesa contra zip bomb. Valor inválido derruba o boot (não vira "sem limite").
  ZIP_MAX_UNCOMPRESSED_BYTES: ${ZIP_MAX_UNCOMPRESSED_BYTES:-268435456}
  ZIP_MAX_ENTRIES: ${ZIP_MAX_ENTRIES:-512}
  # Sessões MCP mantidas em memória.
  MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-500}
  MCP_SESSION_TTL_MS: ${MCP_SESSION_TTL_MS:-1800000}

x-app-common: &app-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [internal]

services:
  # A homepage é estática: não usa banco nenhum, então fica fora de
  # `app-common` (nada de `depends_on: postgres`) e de `app-env`.
  homepage:
    restart: unless-stopped
    networks: [internal]
    image: ghcr.io/patrickbrandao/purple-skills-homepage:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/homepage/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3004
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${HOMEPAGE_PORT:-3004}:3004'

  site:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-site:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
      SITE_TAGLINE: ${SITE_TAGLINE:-}
      # Endereços mostrados na seção "Endereços de acesso" do catálogo.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ADMIN_URL: ${MCP_ADMIN_URL:-}
      ADMIN_URL: ${ADMIN_URL:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${SITE_PORT:-3000}:3000'

  admin:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-admin:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      <<: *app-env
      PORT: 3001
      # A senha de bootstrap cria o PRIMEIRO administrador e depois fica
      # inerte; pode vir por arquivo (Docker secrets). Ver
      # docs/05-accounts-and-roles.md §2.3.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_SECRET_FILE: ${ADMIN_SESSION_SECRET_FILE:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      ADMIN_MAX_UPLOAD_BYTES: ${ADMIN_MAX_UPLOAD_BYTES:-}
      # Endereço público do painel: base do redirect_uri do SSO e do link de
      # redefinição de senha. Vazio = deduzido do Host da requisição.
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      # Rate limiting do login (janela por IP + trava por conta).
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-}
      LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-}
      # Login por OIDC — opcional. Sem OIDC_ALLOWED_DOMAINS o
      # auto-provisionamento fica desligado, de propósito.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      # SMTP — opcional. Sem ele, o reset de senha é feito pelo administrador.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_URL_FILE: ${SMTP_URL_FILE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-3001}:3001'

  mcp-public:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-mcp-public:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp-public/Dockerfile
    environment:
      <<: *app-env
      PORT: 3002
      MCP_PUBLIC_KEY: ${MCP_PUBLIC_KEY:-}
      MCP_PUBLIC_KEY_FILE: ${MCP_PUBLIC_KEY_FILE:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${MCP_PUBLIC_PORT:-3002}:3002'

  mcp-admin:
    <<: *app-common
    image: ghcr.io/patrickbrandao/purple-skills-mcp-admin:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp-admin/Dockerfile
    environment:
      <<: *app-env
      PORT: 3003
      # Obrigatório, mas aceita a variante _FILE; a aplicação é quem valida.
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      MCP_ADMIN_TOKEN_FILE: ${MCP_ADMIN_TOKEN_FILE:-}
      MCP_MAX_ZIP_BASE64: ${MCP_MAX_ZIP_BASE64:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${MCP_ADMIN_PORT:-3003}:3003'

# O volume `pgdata` é declarado em database/docker-compose.yml.

networks:
  internal:
    driver: bridge
