name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O GITHUB_TOKEN entra com o mínimo: nenhum job daqui escreve no repositório —
# os três só fazem checkout e rodam ferramenta local (typecheck, testes, gitleaks
# e build sem push). O cache do npm, o cache `type=gha` do buildx e o resumo do
# build não passam pelo GITHUB_TOKEN (usam o token de execução do runner), então
# continuam funcionando com só leitura.
#
# Declarado aqui e não herdado do repositório de propósito: o padrão de
# `Workflow permissions` pode ser `write` num fork ou noutra organização.
# Se um dia entrar comentário em PR (`pull-requests: write`), push de imagem
# (`packages: write`) ou proveniência assinada (`id-token: write`), declare a
# permissão no job que precisa — não aqui.
permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

  secrets-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks varre o histórico, não só a árvore do último commit.
          fetch-depth: 0

      # Guarda determinística, independente do formato do valor: nenhum arquivo
      # de ambiente pode estar versionado — só o .env.example com placeholders.
      #
      # Casa qualquer caminho cujo *nome de arquivo* comece por `.env`: cobre as
      # formas com ponto (`.env.local`) e com hífen (`.env-builder`,
      # `.env-skills-langwizard`), que os pathspecs `.env.*` deixavam passar.
      # O `[^/]*$` fecha no último componente, para que um diretório começando
      # com `.env` não derrube o CI pelos arquivos de dentro.
      - name: Nenhum .env versionado
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env[^/]*$' \
                    | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::arquivo de ambiente versionado: $tracked"
            exit 1
          fi

      # Byte de controle literal num fonte esconde o conteúdo do arquivo da
      # varredura: quando é o nulo, o git passa a tratar o blob como binário —
      # o diff vira "Binary files differ" e o `gitleaks git`, que lê o
      # histórico por diffs, nunca enxerga aquelas linhas. O grep também
      # recusa o arquivo, então a busca manual por segredo não o alcança.
      #
      # A guarda é sobre os **bytes**, não sobre o veredito do git, e a
      # diferença foi medida: o git procura o nulo só nos primeiros 8 000
      # bytes, então `queries.ts`, com o nulo no byte 274 217, nunca foi
      # marcado como binário — uma guarda baseada em `--numstat` não o
      # pegaria. Três arquivos desta árvore tinham o problema
      # (`explorer.ts`, `queries.ts`, `chunk.test.ts`), todos corrigidos na
      # auditoria de 2026-09-19 (relatório 063).
      #
      # TAB, LF e CR ficam de fora, que é o único conjunto legítimo em fonte.
      # Precisa mesmo do caractere? Monte-o em código
      # (`String.fromCharCode(0)`), como `queries.ts` já fazia — escrever o
      # escape não resolve: há ferramenta de edição que o "resolve" de volta
      # para o byte cru ao gravar o arquivo, que foi como estes três nasceram.
      - name: Nenhum byte de controle nos fontes
        run: |
          sujos=$(git ls-files -z -- \
                    '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' '*.md' \
                    '*.sql' '*.yml' '*.yaml' '*.css' '*.html' '*.sh' \
                    '*.toml' '*.example' \
                  | xargs -0 perl -ne 'if (/[\000-\010\013\014\016-\037\177]/) { print "$ARGV\n"; close ARGV; }')
          if [ -n "$sujos" ]; then
            echo "::error::byte de controle literal em fonte: $sujos"
            exit 1
          fi

      # O pacote é extraído dentro do PATH: conferir os bytes antes de extrair.
      # O hash sai do `checksums.txt` que o próprio gitleaks publica em cada
      # release, não de um valor colado aqui — assim trocar GITLEAKS_VERSION
      # acima já traz o hash certo, sem nada para alguém esquecer de atualizar.
      # (O gitleaks não publica assinatura nem attestation dos tarballs; o
      # arquivo de checksums do release é a verificação mais forte disponível.
      # Ela pega download corrompido ou adulterado no caminho, e asset trocado
      # no release; não pega o release inteiro refeito por quem tem a conta.)
      #
      # O download vai para o RUNNER_TEMP, não para o checkout que o gitleaks
      # varre no passo seguinte.
      - name: Instalar gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          pacote="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$pacote" "$base/$pacote"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Só a linha do pacote que foi baixado. Sem essa linha (versão que não
          # existe, release sem o arquivo) o sha256sum não encontra checksum
          # válido e o passo falha — que é o comportamento desejado.
          awk -v pacote="$pacote" '$2 == pacote' checksums.txt | sha256sum -c -
          sudo tar -xzf "$pacote" -C /usr/local/bin gitleaks

      # --redact: o log do CI é público; um achado não pode imprimir o segredo.
      - name: Varredura do histórico
        run: gitleaks git --redact --no-banner --config=.gitleaks.toml .

  docker:
    name: Build das imagens (sem push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `database` tem Dockerfile próprio (migrations + seed); os 6 apps seguem
      # o padrão apps/<nome>/Dockerfile.
      matrix:
        include:
          - { app: homepage, file: apps/homepage/Dockerfile }
          - { app: site, file: apps/site/Dockerfile }
          - { app: admin, file: apps/admin/Dockerfile }
          - { app: mcp-public, file: apps/mcp-public/Dockerfile }
          - { app: mcp-admin, file: apps/mcp-admin/Dockerfile }
          - { app: indexer, file: apps/indexer/Dockerfile }
          - { app: db, file: database/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
