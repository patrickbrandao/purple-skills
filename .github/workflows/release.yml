name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag adicional para as imagens (ex: beta)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Publicar imagem ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `database` publica purple-skills-db, a imagem que aplica o schema e o
      # seed; os 6 apps seguem o padrão apps/<nome>/Dockerfile.
      matrix:
        include:
          - { app: homepage, file: apps/homepage/Dockerfile }
          - { app: site, file: apps/site/Dockerfile }
          - { app: admin, file: apps/admin/Dockerfile }
          - { app: mcp-public, file: apps/mcp-public/Dockerfile }
          - { app: mcp-admin, file: apps/mcp-admin/Dockerfile }
          - { app: indexer, file: apps/indexer/Dockerfile }
          - { app: db, file: database/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # As imagens vão para o Docker Hub, na conta tmsoftbrasil. O repositório
      # precisa da variável DOCKERHUB_USERNAME e do secret DOCKERHUB_TOKEN (um
      # Personal Access Token da conta, com Read & Write).
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          # O mesmo nome que os composes usam: tmsoftbrasil/purple-skills-<app>.
          images: tmsoftbrasil/purple-skills-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
