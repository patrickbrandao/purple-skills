<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Purple Skills — Admin</title>

    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js-enabled');
        // O painel é escuro por padrão (a referência do redesign); a escolha
        // salva vence. Escrito antes da primeira pintura para não piscar.
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('purple-skills-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {
          /* storage bloqueado: fica no escuro */
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/images/purple-hat-256.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
