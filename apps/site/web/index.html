<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purple Skills — o catálogo de skills dos seus agentes</title>
    <meta
      name="description"
      content="Consulte as skills publicadas neste catálogo, leia o SKILL.md, baixe o pacote .zip e configure seus agentes pelo mcp.json."
    />

    <!-- Compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Purple Skills — o catálogo de skills dos seus agentes" />
    <meta
      property="og:description"
      content="As skills publicadas neste catálogo, prontas para os seus agentes: busca, SKILL.md renderizado e download."
    />
    <meta property="og:image" content="/assets/images/purple-hat-256.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Purple Skills — o catálogo de skills dos seus agentes" />
    <meta
      name="twitter:description"
      content="As skills publicadas neste catálogo, prontas para os seus agentes: busca, SKILL.md renderizado e download."
    />
    <meta name="twitter:image" content="/assets/images/purple-hat-256.png" />

    <!-- Tema antes da primeira pintura, para não piscar branco no modo escuro -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js-enabled');
        var theme = 'light';
        try {
          var saved = localStorage.getItem('purple-skills-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          /* storage bloqueado: fica no tema claro */
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>

    <link rel="preload" href="/assets/fonts/Aeonik-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Aeonik-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/images/purple-hat-256.png" />
    <link rel="apple-touch-icon" href="/assets/images/purple-hat-256.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
